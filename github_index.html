<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>YatriKavach</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app">
        <header>
            <div><b>YatriKavach</b><small>Travel freely. Stay protected.</small></div>
            <div class="actions"><span class="live"><i></i>Live</span><button id="sos">SOS</button></div>
        </header>
        <main>
            <section class="destination">
                <div><label>CURRENT DESTINATION</label>
                    <h1 id="place">Locating you</h1>
                    <p id="country">Enable location to personalize your trip.</p>
                </div><button id="locate">◎</button>
            </section>
            <section class="mapcard">
                <div id="map"></div>
                <div class="status"><i></i>Location monitoring</div>
                <div class="controls"><button id="ml">◎</button><button id="plus">+</button><button
                        id="minus">−</button></div>
                <div class="coords"><span>Current position</span><b id="coords">Waiting for GPS…</b></div>
            </section>
            <section class="safety">
                <div class="row">
                    <div><label>SAFETY STATUS</label>
                        <h2 id="st">Monitoring your trip</h2>
                    </div>
                    <div class="score"><b id="score">--</b><small>/100</small></div>
                </div>
                <div class="meter"><i id="meter"></i></div>
                <p id="msg">Your location and trip context are being checked.</p>
            </section>
            <section class="grid"><button class="tile" id="guide"><b>AI Guide</b><span>Travel, safety & local
                        help</span></button><button class="tile" id="help"><b>Nearby Help</b><span>Emergency services &
                        landmarks</span></button><button class="tile" id="report"><b>Report</b><span>Report an unsafe
                        situation</span></button><button class="tile" id="trip"><b>My Trip</b><span>Stay and travel
                        details</span></button></section>
        </main>
        <nav><button class="active">Explore</button><button>Safety</button><button>Profile</button></nav>
    </div>
    <div class="modal" id="modal">
        <div class="box"><button class="close" id="close">×</button>
            <div id="content"></div>
        </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>

</html>
